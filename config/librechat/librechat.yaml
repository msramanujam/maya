# LibreChat configuration. Mounted read-only at /app/librechat-config/ and
# referenced by CONFIG_PATH; see compose.yaml.
#
# One endpoint: the gateway. LibreChat asks for an alias and does not
# know or care what is behind it — swapping a model is an edit to
# config/litellm/config.yaml and a restart of that container alone. No
# concrete model name belongs in this file; CLAUDE.md makes it a
# rejected PR, and scripts/check phase3 enforces it.

version: 1.2.8
cache: true

endpoints:
  custom:
    - name: "Maya"
      # The gateway's master key, from the environment. Same value every
      # consumer presents; never a literal in a committed file.
      apiKey: "${LITELLM_MASTER_KEY}"
      # LiteLLM on maya-internal. Previously Ollama directly — this line
      # is the whole of what Phase 3 changed here.
      baseURL: "http://maya-litellm:4000/v1"
      models:
        # Discovered from the gateway, so adding an alias there is enough
        # to see it in the picker.
        fetch: true
        # Which alias a new conversation opens on. LibreChat's schema
        # rejects an empty array here, so one name is unavoidable — but
        # it is an alias, not a model.
        default: ["general"]
      titleConvo: true
      # Titling goes to the small model, whatever `fast` currently is.
      titleModel: "fast"
      modelDisplayLabel: "Maya"

# Every new conversation opens on the Maya agent, which carries the MCP
# tools. This is the only way to have tools on by default: `startup` and
# `chatMenu` control whether a server connects and whether it appears in
# the picker, not whether it is active — LibreChat has no setting that
# arms MCP tools for a plain endpoint, so without this the model is
# offered nothing and answers "I don't have access to a real-time clock"
# while holding seventeen tools. See docs/PHASES.md, bug #43.
#
# `default`, not `enforce`: other endpoints and models stay selectable.
modelSpecs:
  list:
    - name: "maya-agent"
      label: "Maya"
      default: true
      description: "The general model, with filesystem, extraction and time tools."
      preset:
        endpoint: "agents"
        agent_id: "${MAYA_AGENT_ID}"

# LibreChat refuses MCP URLs on private hosts unless they are named here —
# `Domain "http://maya-browser:8931" is not allowed`. The whole stack is
# private, so the browser has to be allowed explicitly. Narrow on purpose:
# an exact host:port, not a wildcard, so this cannot become a way for any
# internal service to be reached.
mcpSettings:
  allowedAddresses:
    - "maya-browser:8931"
  allowedDomains:
    - "maya-browser"

# Tool layer. Servers run as stdio subprocesses of this container: no
# prebuilt MCP images were reachable, and the alternative — handing a
# container the Docker socket so it can start them — is a rejected PR
# under CLAUDE.md.
#
# Package caches are mounted (see compose.yaml) so a restart does not
# re-download a server.
mcpServers:
  # Deliberately trivial, and deliberately first. This proves the whole
  # loop — advertised, chosen, executed, returned, reasoned over — before
  # any capability that touches the host is attached to it.
  time:
    type: stdio
    command: uvx
    args: ["mcp-server-time", "--local-timezone=America/Los_Angeles"]
    timeout: 60000

  # Two directories, nothing else. The server is told exactly these
  # paths, and the mounts behind them are read-only at the container
  # level — belt and braces, because a path check is a line of code and a
  # read-only mount is the kernel.
  filesystem:
    type: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "/documents"
      - "/projects"
    timeout: 60000

  # Extraction, so the model can use the PDFs and spreadsheets it can
  # already see. Ours rather than an off-the-shelf server: this image is
  # Alpine/musl and every packaged extractor tried pulls native wheels
  # built for glibc. See docs/PHASES.md.
  extract:
    type: stdio
    command: uvx
    args:
      - "--with"
      - "pypdf"
      - "--with"
      - "python-docx"
      - "--with"
      - "openpyxl"
      - "python"
      - "/app/mcp/extract/server.py"
    timeout: 120000

  # Discovery and retrieval, kept apart on purpose: one tool that
  # searched and then read everything it found would pull ten pages when
  # the model needed one, and fill the context doing it.
  web:
    type: stdio
    command: uvx
    args:
      - "--with"
      - "readability-lxml"
      - "--with"
      - "lxml_html_clean"
      - "--with"
      - "beautifulsoup4"
      - "python"
      - "/app/mcp/web/server.py"
    timeout: 120000
    env:
      SEARXNG_URL: "http://maya-searxng:8080"

  # The last resort, and described as one. A real browser is slow and
  # heavy next to web_fetch, and a model given both will reach for the
  # browser constantly unless the descriptions say plainly when it is
  # warranted. Its own container over HTTP — not a subprocess — because
  # Playwright's Chromium is glibc-only and this image is musl.
  browser:
    type: streamable-http
    url: "http://maya-browser:8931/mcp"
    timeout: 180000

