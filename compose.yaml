# Maya — one compose file for all seven phases.
#
# Phases enable services with profiles, never with overlay files. The
# active profile set is composed by `scripts/maya`; see CLAUDE.md.
#
#   core     phase 1  LibreChat + MongoDB
#   edge     phase 2  Caddy reverse proxy (the only service that may
#                     publish a host port once it exists)
#   gateway  phase 3  LiteLLM
#   tools    phase 4  MCP servers
#   web      phase 5  SearXNG
#   browser  phase 6  Playwright
#   coding   phase 7  coding agent
#
# Profiles beyond `core` are reserved names only — compose has no way to
# declare a profile before a service uses it, so they are recorded here
# and in x-maya-profiles below until their phase lands.

x-maya-profiles: [core, edge, gateway, tools, web, browser, coding]

services:
  mongo:
    image: mongo:7
    container_name: maya-mongo
    profiles: [core]
    restart: unless-stopped
    # No ports: conversation state is reachable only from inside
    # maya-internal. Nothing on the host needs to speak Mongo.
    volumes:
      - ./data/mongo:/data/db
    networks: [maya-internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: maya-librechat
    profiles: [core]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # No ports. Phase 2 moved publishing to Caddy, which is the only
    # service allowed one. Reach LibreChat through the edge, or from a
    # container on maya-internal.
    # host-gateway rather than an OrbStack-specific address: Ollama runs
    # natively on the host because Docker on macOS has no GPU passthrough.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: [.env]
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://mongo:27017/LibreChat
      CONFIG_PATH: /app/librechat-config/librechat.yaml
      # Public origin, so absolute links and cookies are built against
      # the tailnet URL rather than LibreChat's default localhost:3080.
      DOMAIN_CLIENT: ${MAYA_PUBLIC_URL}
      DOMAIN_SERVER: ${MAYA_PUBLIC_URL}
    volumes:
      # Directory, not the file: git replaces inodes rather than editing
      # in place, so a single-file mount silently detaches on checkout or
      # pull and the container finds nothing there on its next restart.
      # See docs/PHASES.md, bug #32.
      - ./config/librechat:/app/librechat-config:ro
      - ./data/librechat/images:/app/client/public/images
      - ./data/librechat/uploads:/app/uploads
      - ./data/librechat/logs:/app/api/logs
      # MCP servers are stdio subprocesses of this container, fetched by
      # uvx/npx on first use. Without these, every restart re-downloads
      # them — slow, and broken entirely without a network.
      - ./data/librechat/cache-uv:/home/node/.cache/uv
      - ./data/librechat/cache-npm:/home/node/.npm
      # The filesystem tool's entire world. Two named directories, both
      # read-only at the mount, so the MCP server's own path checks are
      # not the only thing between the model and the disk. Never the home
      # directory itself, never the host root.
      # Our own MCP servers. Read-only: the container runs them, it does
      # not edit them.
      - ./mcp:/app/mcp:ro
      - ${HOME}/Documents:/documents:ro
      # Read-write, promoted deliberately in story #37. /documents stays
      # ro: the model may read what you wrote, and write only where you
      # asked it to. The asymmetry is asserted in scripts/check, so a
      # future change that quietly widens it fails the run.
      - ${HOME}/Dev:/projects
    # Still both, even though this service no longer publishes anything.
    # maya-internal is where Mongo and Caddy reach it; maya-edge is the
    # only network here with a route off the host, and Ollama lives on
    # the host. Dropping to maya-internal alone kills host.docker.internal
    # outright — `internal: true` means no gateway, so it does not matter
    # that OrbStack terminates that address on loopback.
    networks: [maya-internal, maya-edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: maya-litellm
    profiles: [gateway]
    restart: unless-stopped
    # No ports. Callers reach it on maya-internal by name.
    command: ["--config", "/app/litellm-config/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      # Directory, not the file: a single-file bind mount binds an inode,
      # and git replaces inodes rather than editing in place, so a
      # checkout or pull silently detaches it. See docs/PHASES.md, bug #32.
      - ./config/litellm:/app/litellm-config:ro
    # maya-edge for the same reason LibreChat needs it: Ollama is on the
    # host, and maya-internal has no gateway, so host.docker.internal
    # does not resolve there. Membership is not permission to publish.
    networks: [maya-internal, maya-edge]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  searxng:
    image: searxng/searxng:latest
    container_name: maya-searxng
    profiles: [web]
    restart: unless-stopped
    # No ports. The search tool reaches it by name on maya-internal.
    environment:
      SEARXNG_BASE_URL: http://maya-searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./config/searxng:/etc/searxng:ro
    # maya-edge because searching means reaching the internet. It
    # publishes nothing; membership is not permission.
    networks: [maya-internal, maya-edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  browser:
    build:
      context: ./mcp/browser
    image: maya-playwright-mcp:local
    container_name: maya-browser
    profiles: [browser]
    restart: unless-stopped
    # No ports and, deliberately, no host mounts of any kind — this is the
    # one service that runs untrusted content by design. A named volume,
    # not ./data/browser: that path lives inside ~/Dev, which is mounted
    # read-write into LibreChat as /projects, so a bind mount would put
    # browser state inside the tree the model can write to.
    volumes:
      - browser-state:/data
    networks: [maya-internal, maya-edge]
    # Chromium needs more than the default 64MB of shared memory or it
    # crashes on pages with any real complexity.
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8931/sse').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  coding:
    build:
      context: ./mcp/coding
    image: maya-aider:local
    container_name: maya-coding
    profiles: [coding]
    restart: unless-stopped
    # Exactly one mount, and it is not /documents, not /projects, and not
    # the home directory. The agent edits code and runs commands, so the
    # blast radius is whatever it can see — and that is one repository,
    # named explicitly in .env.
    volumes:
      - ${CODING_REPO}:/repo
    environment:
      # The gateway, by alias. Which model serves `coding` is decided in
      # config/litellm/config.yaml and nowhere else.
      OPENAI_API_BASE: http://maya-litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      AIDER_MODEL: openai/coding
      AIDER_WEAK_MODEL: openai/fast
      AIDER_YES_ALWAYS: "true"
      AIDER_AUTO_COMMITS: "false"
      AIDER_GITIGNORE: "false"
    # No ports, no socket. maya-internal only: it needs the gateway, and
    # nothing else needs it.
    networks: [maya-internal]

  caddy:
    image: caddy:2-alpine
    container_name: maya-caddy
    profiles: [edge]
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/conf/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      librechat:
        condition: service_healthy
    # The one published port in the stack, and it is bound to the
    # Tailscale address — not 0.0.0.0, and not the LAN address. Reaching
    # Maya means being on the tailnet.
    ports:
      - "${TAILSCALE_IP}:443:443"
    volumes:
      # Directory, not the file — see bug #32.
      - ./config/caddy:/etc/caddy/conf:ro
      - ./data/tailscale:/etc/caddy/certs:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks: [maya-internal, maya-edge]
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # The browser's own state, deliberately outside the repo — see the
  # comment on the service.
  browser-state:
    name: maya-browser-state

networks:
  # Service-to-service only: no route off the host, no published ports.
  # Everything that does not have to face outward lives here alone.
  maya-internal:
    name: maya-internal
    driver: bridge
    internal: true

  # The only network with a route off the host. Two things need it: the
  # edge proxy, which publishes a port, and anything that has to reach
  # Ollama on the host. Membership here is not permission to publish —
  # exactly one service does that, and it is Caddy.
  maya-edge:
    name: maya-edge
    driver: bridge
