# SearXNG for Maya. Reached only from inside maya-internal; no host port.
#
# JSON is off in stock SearXNG and is the entire reason this exists here
# — a tool cannot parse the HTML UI. See docs/PHASES.md.

use_default_settings: true

server:
  # Not a credential in the usual sense, but it signs session data, so it
  # comes from the environment rather than sitting in this file.
  secret_key: "${SEARXNG_SECRET}"
  limiter: false            # no public traffic to rate-limit
  image_proxy: false

search:
  # html is kept so a human can open it for debugging; json is what the
  # tool uses.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

ui:
  static_use_hash: true

# Note `use_default_settings: true` means this list *modifies* the default
# engine set, it does not replace it — an easy thing to get wrong, and the
# reason engines we never named were still being queried and failing.
#
# The ones disabled below returned errors or access-denied on every query
# from this host. The rest are kept because aggregating several is what
# makes a result set robust: individual engines rate-limit or serve a
# CAPTCHA under repeated automated queries, and recover on their own.
engines:
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: aol
    disabled: true
  - name: karmasearch
    disabled: true
